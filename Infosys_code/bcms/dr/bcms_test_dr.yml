name: bcms-hms-dr-CI/CD
on:
  workflow_dispatch:
 
permissions:
  contents: write         # action will commit/push encrypted state
  id-token: write         # required for Azure OIDC login
  actions: read
  deployments: write
 
concurrency:
  group: terraform-test-state
  cancel-in-progress: false
 
env:
  TF_VAR_subscription_id: ${{ vars.DR_AZURE_SUBSCRIPTION_ID }}
  TF_VAR_tenant_id:       ${{ vars.DR_AZURE_TENANT_ID }}
  ARM_USE_OIDC: true
  ARM_CLIENT_ID:       ${{ vars.DR_AZURE_CLIENT_ID }}
  ARM_TENANT_ID:       ${{ vars.DR_AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.DR_AZURE_SUBSCRIPTION_ID }}  
 
jobs:
  stage-plan:
    runs-on: arc-runner-set10
    environment: dr
    env:
      TF_WORKDIR: bcms_hms/test_dr
 
    steps:
      - uses: actions/checkout@v4
 
      # - name: Install Azure CLI (Ubuntu)
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y ca-certificates curl apt-transport-https lsb-release gnupg
      #     curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      #     az version
 
      - name: Install Azure CLI
 
        run: |
          echo "Installing Azure CLI..."
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
 
      - name: Wait for Azure CLI
        run: |    
          for i in {1..10}; do  
            if command -v az &> /dev/null; then  
              echo "Azure CLI found"
              az version
              exit 0      
            fi      
            echo "Waiting for az..."      
            sleep 3      
          done      
          echo "Azure CLI not installed"
          exit 1
       
 
      # - name: Wait 20 seconds
      #   run: sleep 20
           
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ vars.DR_AZURE_CLIENT_ID }}
          tenant-id:       ${{ vars.DR_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.DR_AZURE_SUBSCRIPTION_ID }}
 
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
 
      - name: Terraform fmt (check)
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform fmt -recursive
 
      - name: Terraform init (AAD backend)
        working-directory: ${{ env.TF_WORKDIR }}
        run: |
          terraform init -input=false \
            -backend-config="storage_account_name=${{ vars.DR_TF_BACKEND_SA }}" \
            -backend-config="container_name=${{ vars.DR_TF_BACKEND_CONTAINER }}" \
            -backend-config="key=${{ vars.DR_TF_BACKEND_KEY }}" \
            -backend-config="sas_token=${{ secrets.DR_TF_SAS_TOKEN }}"    
 
      - name: Terraform validate
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform validate
 
      - name: Terraform plan (DR)
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform plan -input=false -var "sqlmi_administrator_login=${{ secrets.sqlmi_administrator_login }}" -var "sqlmi_admin_password=${{ secrets.sqlmi_admin_password }}"
 
  stage-apply:
    runs-on: arc-runner-set10
    needs: [ stage-plan ]
    environment: test-stage-apply
 
    env:
      TF_WORKDIR: bcms_hms/test_dr
 
    steps:
      - uses: actions/checkout@v4
 
      # - name: Install Azure CLI (Ubuntu)
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y ca-certificates curl apt-transport-https lsb-release gnupg
      #     curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
 
      - name: Install Azure CLI
 
        run: |
          echo "Installing Azure CLI..."
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
 
      - name: Wait for Azure CLI
        run: |    
          for i in {1..10}; do  
            if command -v az &> /dev/null; then  
              echo "Azure CLI found"
              az version
              exit 0      
            fi      
            echo "Waiting for az..."      
            sleep 3      
          done      
          echo "Azure CLI not installed"
          exit 1
 
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ vars.TEST_AZURE_CLIENT_ID }}
          tenant-id:       ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.TEST_AZURE_SUBSCRIPTION_ID }}
 
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
 
      - name: Terraform fmt (check)
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform fmt -recursive
 
      - name: Terraform init (AAD backend)
        working-directory: ${{ env.TF_WORKDIR }}
        run: |
          terraform init -input=false \
            -backend-config="storage_account_name=${{ vars.TEST_TF_BACKEND_SA }}" \
            -backend-config="container_name=${{ vars.DR_TF_BACKEND_CONTAINER }}" \
            -backend-config="key=${{ vars.DR_TF_BACKEND_KEY }}" \
            -backend-config="sas_token=${{ secrets.DR_TF_SAS_TOKEN }}"    
 
 
      - name: Terraform apply (DR)
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform apply -auto-approve -input=false -var "sqlmi_administrator_login=${{ vars.dr_test_sqlmi_administrator_login }}" -var "sqlmi_admin_password=${{ secrets.dr_test_sqlmi_admin_password }}"
