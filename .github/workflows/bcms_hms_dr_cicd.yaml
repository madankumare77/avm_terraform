name: bcms-hms-dr-CI/CD
on:
  workflow_dispatch:
    # branches:
    #   - dt_main
    # paths:
    #   - bcms_hms/dr/**
 
permissions:
  contents: write         # action will commit/push encrypted state
  id-token: write         # required for Azure OIDC login
  actions: read
  deployments: write
 
concurrency:
  group: terraform-test-state
  cancel-in-progress: false
 
jobs:
  stage-plan:
    runs-on: arc-runner-set10
    environment: DR
    env:
      TF_WORKDIR: bcms_hms/dr
 
    steps:
      - uses: actions/checkout@v4
 
      - name: Install Azure CLI (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl apt-transport-https lsb-release gnupg
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
 
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.DR_AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.DR_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.DR_AZURE_SUBSCRIPTION_ID }}
 
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
 
      - name: Terraform fmt (check)
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform fmt -recursive
 
      - name: Terraform init (AAD backend)
        working-directory: ${{ env.TF_WORKDIR }}
        run: |
          terraform init -input=false \
            -backend-config="storage_account_name=${{ secrets.DR_TF_BACKEND_SA }}" \
            -backend-config="container_name=${{ secrets.DR_TF_BACKEND_CONTAINER }}" \
            -backend-config="key=${{ secrets.DR_TF_BACKEND_KEY }}" \
            -backend-config="sas_token=${{ secrets.DR_TF_SAS_TOKEN }}"    
 
      - name: Terraform validate
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform validate
 
      - name: Terraform plan (DR)
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform plan -input=false
 
  stage-apply:
    runs-on: arc-runner-set10
    needs: [ stage-plan ]
    environment: DR
 
    env:
      TF_WORKDIR: bcms_hms/dr
 
    steps:
      - uses: actions/checkout@v4
 
      - name: Install Azure CLI (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl apt-transport-https lsb-release gnupg
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
 
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.DR_AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.DR_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.DR_AZURE_SUBSCRIPTION_ID }}
 
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
 
      - name: Terraform fmt (check)
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform fmt -recursive
 
      - name: Terraform init (AAD backend)
        working-directory: ${{ env.TF_WORKDIR }}
        run: |
          terraform init -input=false \
            -backend-config="storage_account_name=${{ secrets.DR_TF_BACKEND_SA }}" \
            -backend-config="container_name=${{ secrets.DR_TF_BACKEND_CONTAINER }}" \
            -backend-config="key=${{ secrets.DR_TF_BACKEND_KEY }}" \
            -backend-config="sas_token=${{ secrets.DR_TF_SAS_TOKEN }}"    
 
 
      - name: Terraform apply (DR)
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform apply -auto-approve -input=false