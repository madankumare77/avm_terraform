name: CCD-CI/CD
on:
  workflow_dispatch:
 
permissions:
  contents: write         # action will commit/push encrypted state
  id-token: write         # required for Azure OIDC login
  actions: read
  deployments: write
 
concurrency:
  group: terraform-test-state
  cancel-in-progress: false
 
env:
  TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_tenant_id:       ${{ vars.AZURE_TENANT_ID }}
  TF_VAR_client_id:       ${{ vars.AZURE_CLIENT_ID }}
  ARM_USE_OIDC: true
 
jobs:
  stage-plan:
    runs-on: 
    environment: test-stage-plan
    env:
      TF_WORKDIR: 
 
    steps:
      - uses: actions/checkout@v4
           
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ vars.AZURE_CLIENT_ID }}
          tenant-id:       ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
 
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
 
      - name: Terraform fmt (check)
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform fmt -recursive
 
      - name: Terraform init (AAD backend)
        working-directory: ${{ env.TF_WORKDIR }}
        run: |
          terraform init -input=false \
            -backend-config="storage_account_name=${{ vars.TF_BACKEND_SA }}" \
            -backend-config="container_name=${{ vars.TF_BACKEND_CONTAINER }}" \
            -backend-config="key=${{ vars.TF_BACKEND_KEY }}" \
            -backend-config="sas_token=${{ secrets.TF_SAS_TOKEN }}"    
 
      - name: Terraform validate
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform validate
 
      - name: Terraform plan (DR)
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform plan -input=false
 
  stage-apply:
    runs-on: arc-runner-set10
    needs: [ stage-plan ]
    environment: test-stage-apply
 
    env:
      TF_WORKDIR: 
 
    steps:
      - uses: actions/checkout@v4
 
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ vars.AZURE_CLIENT_ID }}
          tenant-id:       ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
 
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
 
      - name: Terraform fmt (check)
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform fmt -recursive
 
      - name: Terraform init (AAD backend)
        working-directory: ${{ env.TF_WORKDIR }}
        run: |
          terraform init -input=false \
            -backend-config="storage_account_name=${{ vars.TF_BACKEND_SA }}" \
            -backend-config="container_name=${{ vars.TF_BACKEND_CONTAINER }}" \
            -backend-config="key=${{ vars.TF_BACKEND_KEY }}" \
            -backend-config="sas_token=${{ secrets.TF_SAS_TOKEN }}"  
 
 
      - name: Terraform apply (DR)
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform apply -auto-approve -input=false
